name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Unit tests never touch the database or the model, so this job needs no secrets.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # After the build: Next generates global types (e.g. LayoutProps) into .next/types.
      - name: Typecheck
        run: pnpm exec tsc --noEmit
